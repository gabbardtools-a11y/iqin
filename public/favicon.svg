<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E1F"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur1"/>
      <feGaussianBlur stdDeviation="2.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 0 0 0 4" fill="none" stroke="#3B82F6" stroke-width="0.25" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.6"/>

  <!-- Circuit corner brackets (stronger) -->
  <path d="M 3.5 3.5 L 3.5 7.5 M 3.5 3.5 L 7.5 3.5" stroke="url(#neon)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 28.5 3.5 L 28.5 7.5 M 28.5 3.5 L 24.5 3.5" stroke="url(#neon)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 3.5 28.5 L 3.5 24.5 M 3.5 28.5 L 7.5 28.5" stroke="url(#neon)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 28.5 28.5 L 28.5 24.5 M 28.5 28.5 L 24.5 28.5" stroke="url(#neon)" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- Horizontal scan line through middle (stronger) -->
  <line x1="3" y1="16" x2="29" y2="16" stroke="url(#neon)" stroke-width="0.6" opacity="0.65"/>

  <!-- 音 character — bright neon with strong glow -->
  <text x="16" y="22.5" text-anchor="middle"
        font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif"
        font-size="17" font-weight="900"
        fill="url(#neon)" filter="url(#glow)">音</text>
</svg>
